import org.moallemi.gradle.internal.VersionCodeType


apply from: '../common/gindin-android.gradle'

// Wrap with try/catch so the build is working even if the signing stuff is missing.
//  Got this idea from Mike Penz's AboutLibraries
try {
  apply from: 'zmanim.gradle'
}
catch ( ignored ) {
}


project.ext.set( "majorVersion", 4 )
project.ext.set( "minorVersion", 0 )
project.ext.set( "versionCodeType", VersionCodeType.AUTO_INCREMENT_ONE_STEP )

apply from: '../common/gindin-versioning.gradle'

/*
 * Stuff that we need to load...
 */
Properties flurry = new Properties()
flurry.load( new FileInputStream( project.projectDir.getPath() + "/../common/flurry.properties" ) )
String flurryKey = "\"" + flurry[ 'flurry.key' ] + "\""

Properties mapQuest = new Properties()
mapQuest.load( new FileInputStream( project.projectDir.getPath() + "/../common/MapQuest.properties" ) )
String mapQuestKey = "\"" + mapQuest[ 'mapquest.key' ] + "\""

Properties acraProps = new Properties()
acraProps.load( new FileInputStream( project.projectDir.getPath() + "/../common/AcraApiKey.properties" ) )
String acraUser = "\"" + acraProps[ 'acra.user' ] + "\""
String acraPassword = "\"" + acraProps[ 'acra.password' ] + "\""


android {
  compileSdkVersion 24
  buildToolsVersion '25.0.3'

  defaultConfig {
    applicationId "com.gindin.zmanim.android"

    /*
     * NOTES:
     *	  1. In order for the supports-screens to work right, we have to specify the target SDK of at least 11.
     *		2. If minSdkVersion is >= 13, then the behavior of AsyncTask is CHANGED!
     *					See http://commonsware.com/blog/2012/04/20/asynctask-threading-regression-confirmed.html
     *					For minSdkVersion >= 11, there's some other interesting stuff in that article...
     */
    minSdkVersion 10
    targetSdkVersion 24

    versionCode appVersionCode
    versionName appVersionName

    String replace = appVersionName;
    copy {
      from( 'src/template/assets/com/gindin/zmanim/android/about.html' ) {
        filter { String line -> line.replace( "@@VERSION@@", replace ) }
      }
      into 'src/main/assets/com/gindin/zmanim/android'
    }
  }

  buildTypes {
    release {

      buildConfigField "String", "MAPQUEST_KEY", "${mapQuestKey}"
      buildConfigField "String", "FLURRY_KEY", "${flurryKey}"
      buildConfigField "String", "ACRA_KEY", "${acraPassword}"
      buildConfigField "String", "ACRA_USER", "${acraUser}"

      minifyEnabled false

      /*
       * Library-specific proguard files.
       * See https://github.com/krschultz/android-proguard-snippets.
       */
      proguardFile 'proguard-flurry.pro'
      proguardFile 'proguard-google-play-services.pro'
      proguardFile 'proguard-support-design.pro'
      proguardFile 'proguard-support-v7-appcompat.pro'
      proguardFile "proguard-project.pro"

      /* Reminder: Use the default proguard from the SDK, and then add in our custom proguard rules. */
      proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'

      zipAlignEnabled true

      signingConfig signingConfigs.release
    }

    debug {
      buildConfigField "String", "MAPQUEST_KEY", "${mapQuestKey}"
      buildConfigField "String", "FLURRY_KEY", "\"DEV\""
      buildConfigField "String", "ACRA_KEY", "\"DEV\""
      buildConfigField "String", "ACRA_USER", "\"DEV\""
    }
  }

  productFlavors {
  }

}

dependencies {
  compile project( ':ZmanUtils' )

  compile 'com.android.support:design:24.2.1'
  compile 'com.android.support:appcompat-v7:24.2.1'
  compile 'com.android.support:preference-v7:24.2.1'

  // ACRA
  compile 'ch.acra:acra:4.9.1'

  // Flurry
  compile 'com.flurry.android:analytics:6.7.0'

  testCompile 'junit:junit:4.12'
}
