name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      # Also validates the Gradle wrapper's checksum, and caches Gradle state between runs.
      - uses: gradle/actions/setup-gradle@v6
      # Before the tests so that a formatting or static-analysis finding fails the job in seconds. Run
      #  ./gradlew ktfmtFormat to fix the formatting locally.
      - name: Check Kotlin formatting and static analysis
        run: ./gradlew ktfmtCheck detekt
      # Android lint's NewApi check, on each app's release variants and on :ZmanUtils' Android target: fails on a call
      #  to an API above minSdk (24), which the Robolectric and JVM tests cannot notice because the desktop JVM has every
      #  java.* API. In the apps it is run as part of lint's fatal-only "vital" checks, the same ones a release build runs.
      #  :ZmanLib is a plain JVM module, which lint's NewApi check does not cover.
      - name: Check for calls to APIs above minSdk
        run: ./gradlew checkNewApi
      - name: Run unit tests, Roborazzi verification and a debug build
        run: ./gradlew test verifyRoborazziDebug assembleDebug
      # Runs R8 on the release variants and fails if it renamed or removed a name that a keep rule exists to
      #  preserve (each app's r8-kept-names.txt lists them). Neither R8 nor this check needs the upload key, so it
      #  works on CI, where no signing properties are set.
      - name: Check that the release builds keep the names their R8 rules protect
        run: ./gradlew checkR8KeptNames
      - name: Upload test, Roborazzi and lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/tests/**
            **/build/outputs/roborazzi/**
            **/build/reports/lint-results-*
            **/build/intermediates/lint_vital_intermediate_text_report/**

  # Runs the on-device tests (src/androidTest of :Zmanim and :ZehutYosef) on an emulator at the
  #  API floor and ceiling. These guard window insets / ActionBar layout and real process launches,
  #  which Robolectric cannot observe.
  #
  # Not a merge gate: branch protection requires only `verify`, and `continue-on-error` keeps a
  #  flaky emulator boot or runner outage from turning the whole workflow red while this job is
  #  new. Drop `continue-on-error` once it has proven stable.
  emulator-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 36]
    steps:
      - uses: actions/checkout@v7
      # Hardware acceleration for the emulator: lets the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          # google_apis: the app uses Google Play Services location APIs and the Geocoder.
          target: google_apis
          disable-animations: true
          # OfflinePlaceNamingTest runs first and on its own, with Wi-Fi and mobile data turned off as root (the shell
          #  user cannot turn them off on every API level); requireOffline makes it fail rather than skip if the
          #  emulator still has a network. Its results are moved aside so the main run does not overwrite them, and the
          #  results check reads them as "Zmanim offline". A failing command here does not stop the main run: the
          #  results check reports it.
          script: |
            adb shell su 0 svc wifi disable; adb shell su 0 svc data disable
            ./gradlew :Zmanim:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.gindin.zmanim.android.OfflinePlaceNamingTest -Pandroid.testInstrumentationRunnerArguments.requireOffline=true || true
            mv Zmanim/build/outputs/androidTest-results/connected Zmanim/build/outputs/androidTest-results/offline || true
            adb shell su 0 svc wifi enable; adb shell su 0 svc data enable
            ./gradlew :Zmanim:connectedDebugAndroidTest :ZehutYosef:connectedBarMitzvahDebugAndroidTest :ZehutYosef:connectedSidurDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.gindin.zmanim.android.OfflinePlaceNamingTest
      # A connected task finishes successfully, with no results, when an APK fails to install, and with an empty result
      #  when the instrumentation crashes before its first test (for instance on a class R8 removed from the app).
      #  Requiring tests to have run in Zmanim and in each ZehutYosef flavor treats both as the failures they are.
      - name: Fail if a module ran no instrumented tests
        run: python3 .github/scripts/check-instrumented-results.py
      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-reports-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**

  # Runs the same on-device tests against the R8-minified releaseCheck build type (release code and keep rules,
  #  debug signature, since CI has no upload key), so a keep rule that the app needs at runtime but the JVM and debug
  #  tests cannot see (Java serialization of NotifiedZmanim, Zmanim.Type by name, reflection) fails a test here.
  #  checkR8KeptNames in `verify` guards the same names statically; this job checks the app actually works with them.
  #
  # Not a merge gate, for the same reasons as emulator-smoke. One API level is enough: what it guards depends on R8's
  #  output, not on the platform version.
  emulator-minified:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Hardware acceleration for the emulator: lets the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run instrumented tests against the minified build on an emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          # google_apis: the app uses Google Play Services location APIs and the Geocoder.
          target: google_apis
          disable-animations: true
          # The offline place-naming test runs first, offline, as in emulator-smoke: R8 must not break reading the
          #  bundled place data.
          script: |
            adb shell su 0 svc wifi disable; adb shell su 0 svc data disable
            ./gradlew -Pzmanim.testBuildType=releaseCheck :Zmanim:connectedReleaseCheckAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.gindin.zmanim.android.OfflinePlaceNamingTest -Pandroid.testInstrumentationRunnerArguments.requireOffline=true || true
            mv Zmanim/build/outputs/androidTest-results/connected Zmanim/build/outputs/androidTest-results/offline || true
            adb shell su 0 svc wifi enable; adb shell su 0 svc data enable
            ./gradlew -Pzmanim.testBuildType=releaseCheck :Zmanim:connectedReleaseCheckAndroidTest :ZehutYosef:connectedBarMitzvahReleaseCheckAndroidTest :ZehutYosef:connectedSidurReleaseCheckAndroidTest -Pandroid.testInstrumentationRunnerArguments.notClass=com.gindin.zmanim.android.OfflinePlaceNamingTest
      # A connected task finishes successfully, with no results, when an APK fails to install, and with an empty result
      #  when the instrumentation crashes before its first test (for instance on a class R8 removed from the app).
      #  Requiring tests to have run in Zmanim and in each ZehutYosef flavor treats both as the failures they are.
      - name: Fail if a module ran no instrumented tests
        run: python3 .github/scripts/check-instrumented-results.py
      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-minified-reports
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/mapping/**
