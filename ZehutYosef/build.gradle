import org.moallemi.gradle.internal.VersionCodeType


apply from: '../common/gindin-android.gradle'

// Wrap with try/catch so the build is working even if the signing stuff is missing.
//  Got this idea from Mike Penz's AboutLibraries
try {
  apply from: 'zehut-yosef.gradle'
}
catch ( ignored ) {
}


project.ext.set( "majorVersion", 1 )
project.ext.set( "minorVersion", 0 )
project.ext.set( "versionCodeType", VersionCodeType.AUTO_INCREMENT_ONE_STEP )

apply from: '../common/gindin-versioning.gradle'

android {

  compileSdkVersion 26

  defaultConfig {
    minSdkVersion 14
    targetSdkVersion 25
    versionCode appVersionCode
    versionName appVersionName
  }

  buildTypes {

    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'

      try {
        // In case this dev doesn't have the signing keys, this will fail...
        signingConfig signingConfigs.release
      }
      catch ( ignored ) {}
    }

    debug {
    }
  }

  flavorDimensions "sidur"

  productFlavors {
    barMitzvah {
      applicationId "com.gindin.barmitzvah"
    }

    sidur {
      applicationId "com.gindin.zehutyosef"
    }
  }

  sourceSets { zehutYosef { res.srcDirs = ['src/zehutYosef/res', 'src/zehutYosef/res/values-he'] } }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {

  ext.supportLibsVersion = "26.1.0"

  //required support lib modules
  implementation "com.android.support:appcompat-v7:${supportLibsVersion}"
  implementation "com.android.support:cardview-v7:${supportLibsVersion}"
  implementation "com.android.support:recyclerview-v7:${supportLibsVersion}"
  implementation "com.android.support:support-annotations:${supportLibsVersion}"
  implementation "com.android.support:design:${supportLibsVersion}"

  /* Used to provide out of the box icon font support. simplifies development, and provides scalable icons.
   *  the core is very very light. https://github.com/mikepenz/Android-Iconics
   */
  implementation 'com.mikepenz:google-material-typeface:3.0.1.2.original@aar'
  implementation 'com.mikepenz:fontawesome-typeface:4.7.0.2@aar'

  /* https://github.com/mikepenz/MaterialDrawer */
  implementation("com.mikepenz:materialdrawer:6.0.2@aar") {
     transitive = true
  }

  /* https://github.com/mikepenz/AboutLibraries */
  compile( 'com.mikepenz:aboutlibraries:5.6.2@aar' ) {
    transitive = true
  }

  //this adds all ui view widgets (IconicsButton, IconicsImageView, ...)
  implementation "com.mikepenz:iconics-views:3.0.0@aar"

  testImplementation 'junit:junit:4.12'
}
