import org.moallemi.gradle.internal.VersionCodeType

apply plugin: 'com.android.application'
apply plugin: 'org.moallemi.advanced-build-version'
apply from: 'zehut-yosef.gradle'


def hgVersion() {
  def hgVersion = 'hg log --limit 1 --template \'{node|short}\''.execute().text.trim();
  print( hgVersion )

  return "\"" + hgVersion + "\""
}


advancedVersioning {

  nameOptions {
    versionMajor 1
    versionMinor 0
  }
  codeOptions {
    versionCodeType VersionCodeType.AUTO_INCREMENT_ONE_STEP
  }
  outputOptions {
    renameOutput true
    nameFormat '${appName}-${flavorName}-${buildType}-${versionName}'
  }
}

def appVersionName = advancedVersioning.versionName
def appVersionCode = advancedVersioning.versionCode


android {

  compileSdkVersion 22
  buildToolsVersion "21.1.2"
  defaultConfig {
    applicationId "com.gindin.zehutyosef"
    minSdkVersion 10
    targetSdkVersion 22
    versionCode appVersionCode
    versionName appVersionName
  }

  buildTypes {

    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'
      signingConfig signingConfigs.release
      buildConfigField "String", "HG_VERSION", hgVersion()
    }

    debug {
      buildConfigField "String", "HG_VERSION", hgVersion()
    }
  }
}

dependencies {
  compile fileTree( include: ['*.jar'], dir: 'libs' )
  compile 'com.android.support:appcompat-v7:22.1.1'
}
