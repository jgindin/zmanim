apply plugin: 'com.android.application'

android {
    signingConfigs {
        config {
            keyAlias 'android-app'
            storeFile file( '/home/jgindin/src/gindin/MIGRATION/zmanim/common/jay-gindin-android-apps.keystore' )
        }
    }
    compileSdkVersion 21
    buildToolsVersion "21.1.2"
    defaultConfig {
        applicationId "gindin.com.zmanim"
        minSdkVersion 10
        targetSdkVersion 21
        versionCode 1
        versionName "1.0"
        signingConfig signingConfigs.config
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'
            signingConfig signingConfigs.config
        }
    }
    productFlavors {
    }
}

dependencies {
    compile fileTree( include: ['*.jar'], dir: 'libs' )
    compile 'com.android.support:appcompat-v7:21.0.3'
    compile project( ':ZmanLib' )
}
