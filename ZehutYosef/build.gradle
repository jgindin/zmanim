import org.moallemi.gradle.internal.VersionCodeType


apply from: '../common/gindin-android.gradle'

// Wrap with try/catch so the build is working even if the signing stuff is missing.
//  Got this idea from Mike Penz's AboutLibraries
try {
  apply from: 'zehut-yosef.gradle'
}
catch ( ignored ) {
}


project.ext.set( "majorVersion", 1 )
project.ext.set( "minorVersion", 0 )
project.ext.set( "versionCodeType", VersionCodeType.AUTO_INCREMENT_ONE_STEP )

apply from: '../common/gindin-versioning.gradle'

android {

  compileSdkVersion 24

  defaultConfig {
    minSdkVersion 14
    targetSdkVersion 24
    versionCode appVersionCode
    versionName appVersionName
  }

  buildTypes {

    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'

      try {
        // In case this dev doesn't have the signing keys, this will fail...
        signingConfig signingConfigs.release
      }
      catch ( ignored ) {}
    }

    debug {
    }
  }

  flavorDimensions "sidur"

  productFlavors {
    barMitzvah {
      applicationId "com.gindin.barmitzvah"
    }

    sidur {
      applicationId "com.gindin.zehutyosef"
    }
  }

  sourceSets { zehutYosef { res.srcDirs = ['src/zehutYosef/res', 'src/zehutYosef/res/values-he'] } }
}

dependencies {
  compile 'com.android.support:appcompat-v7:24.2.1'

  /* Used to provide out of the box icon font support. simplifies development, and provides scalable icons.
   *  the core is very very light. https://github.com/mikepenz/Android-Iconics
   */
  compile 'com.mikepenz:iconics-core:2.5.10@aar'
  compile 'com.mikepenz:google-material-typeface:2.2.0.1.original@aar'
  compile 'com.mikepenz:fontawesome-typeface:4.5.0.1@aar'

  /* https://github.com/mikepenz/MaterialDrawer */
  compile 'com.mikepenz:materialdrawer:3.0.8@aar'

  /* https://github.com/mikepenz/AboutLibraries */
  compile('com.mikepenz:aboutlibraries:5.6.2@aar') {
    transitive = true
  }
  testCompile 'junit:junit:4.12'
}
