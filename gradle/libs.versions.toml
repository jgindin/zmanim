[versions]
agp = "9.4.1"
kotlin = "2.4.20"
moallemiAdvancedBuildVersion = "1.5.0"
roborazzi = "1.74.0"
foojayResolverConvention = "0.10.0"

kosherjavaZmanim = "2.5.0"
jetbrainsAnnotations = "24.0.1"
junit = "4.13.2"
# JUnit 6 versions the Platform (launcher), Jupiter and Vintage in lockstep, so one ref serves all three.
junitJupiter = "6.1.3"
hamcrest = "2.2"
kotlinxSerializationJson = "1.11.0"
kotlinxDatetime = "0.8.0"

androidxConstraintlayout = "1.1.3"
androidxAppcompat = "1.6.1"
androidxPreference = "1.2.1"
googleMaterial = "1.0.0"
playServicesLocation = "21.4.0"

robolectric = "4.15.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestUiautomator = "2.4.0"
androidxComposeUiTest = "1.12.1"

mikepenzIconicsCore = "2.5.10"
mikepenzGoogleMaterialTypeface = "2.2.0.1.original"
mikepenzFontawesomeTypeface = "4.5.0.1"
mikepenzMaterialdrawer = "3.0.8"
mikepenzAboutlibraries = "5.6.2"

[libraries]
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
moallemi-advanced-build-version-gradlePlugin = { group = "org.moallemi.gradle.advanced-build-version", name = "gradle-plugin", version.ref = "moallemiAdvancedBuildVersion" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
roborazzi-gradlePlugin = { group = "io.github.takahirom.roborazzi", name = "roborazzi-gradle-plugin", version.ref = "roborazzi" }

kosherjava-zmanim = { group = "com.kosherjava", name = "zmanim", version.ref = "kosherjavaZmanim" }
jetbrains-annotations = { group = "org.jetbrains", name = "annotations", version.ref = "jetbrainsAnnotations" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiter" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitJupiter" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitJupiter" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
hamcrest = { group = "org.hamcrest", name = "hamcrest", version.ref = "hamcrest" }

androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidxConstraintlayout" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidxAppcompat" }
androidx-preference = { group = "androidx.preference", name = "preference", version.ref = "androidxPreference" }
google-material = { group = "com.google.android.material", name = "material", version.ref = "googleMaterial" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }

robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "androidxTestEspresso" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "androidxTestUiautomator" }
androidx-compose-ui-test = { group = "androidx.compose.ui", name = "ui-test", version.ref = "androidxComposeUiTest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "androidxComposeUiTest" }

mikepenz-iconics-core = { group = "com.mikepenz", name = "iconics-core", version.ref = "mikepenzIconicsCore" }
mikepenz-google-material-typeface = { group = "com.mikepenz", name = "google-material-typeface", version.ref = "mikepenzGoogleMaterialTypeface" }
mikepenz-fontawesome-typeface = { group = "com.mikepenz", name = "fontawesome-typeface", version.ref = "mikepenzFontawesomeTypeface" }
mikepenz-materialdrawer = { group = "com.mikepenz", name = "materialdrawer", version.ref = "mikepenzMaterialdrawer" }
mikepenz-aboutlibraries = { group = "com.mikepenz", name = "aboutlibraries", version.ref = "mikepenzAboutlibraries" }

[bundles]
# The Roborazzi screen-snapshot safety net (see each app's src/test/.../snapshot): all five are
#  always pulled in together, all as plain testImplementation with no per-dependency config, so a
#  bundle is a clean fit. NOT included here: junit/junit-jupiter/junit-vintage-engine/
#  junit-platform-launcher (they split across testImplementation and testRuntimeOnly, and a bundle
#  applies everything under one configuration) and the two androidx-compose-ui-test* entries (they
#  each need transitive = false, which a bundle member can't carry).
roborazzi = ["robolectric", "roborazzi", "roborazzi-junit-rule", "androidx-test-core", "androidx-test-ext-junit"]

# On-device (androidTest) stack shared by :Zmanim and :ZehutYosef. Kept apart from the Roborazzi
#  bundle because the two run in different places: that one under Robolectric on the JVM, this one
#  as an instrumentation APK on an emulator or device.
instrumented = ["androidx-test-core", "androidx-test-ext-junit", "androidx-test-runner", "androidx-test-rules", "androidx-test-espresso-core"]

# Zmanim's own UI/location dependency stack (Zmanim/build.gradle.kts) -- all six are plain
#  implementation with no per-dependency config, and (unlike the Roborazzi bundle above) this one
#  is module-specific rather than shared with :ZehutYosef, so it stays out of the convention
#  plugin and is applied directly in Zmanim/build.gradle.kts instead.
zmanim-ui = ["androidx-constraintlayout", "androidx-appcompat", "androidx-preference", "google-material", "play-services-location"]

[plugins]
# There is deliberately no org.jetbrains.kotlin.android alias: AGP's built-in Kotlin support
#  provides Kotlin for the app modules, and applying that plugin on top of it breaks the build.
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
moallemi-advanced-build-version = { id = "org.moallemi.advanced-build-version", version.ref = "moallemiAdvancedBuildVersion" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojayResolverConvention" }
