import org.moallemi.gradle.internal.VersionCodeType


apply from: '../common/gindin-android.gradle'

// Wrap with try/catch so the build is working even if the signing stuff is missing.
//  Got this idea from Mike Penz's AboutLibraries
try {
  apply from: 'zmanim.gradle'
}
catch ( ignored ) {
}


project.ext.set( "majorVersion", 4 )
project.ext.set( "minorVersion", 0 )
project.ext.set( "versionCodeType", VersionCodeType.AUTO_INCREMENT_ONE_STEP )

apply from: '../common/gindin-versioning.gradle'


android {
  compileSdkVersion 23
  buildToolsVersion "23.0.3"


  defaultConfig {
    applicationId "com.gindin.zmanim.android"

    /*
     * NOTES:
     *	  1. In order for the supports-screens to work right, we have to specify the target SDK of at least 11.
     *		2. If minSdkVersion is >= 13, then the behavior of AsyncTask is CHANGED!
     *					See http://commonsware.com/blog/2012/04/20/asynctask-threading-regression-confirmed.html
     *					For minSdkVersion >= 11, there's some other interesting stuff in that article...
     */
    minSdkVersion 10
    targetSdkVersion 22

    versionCode appVersionCode
    versionName appVersionName

    String replace = appVersionName;

    copy {
      from( 'src/template/assets/com/gindin/zmanim/android/about.html' ) {
        filter{ String line -> line.replace( "@@VERSION@@", replace ) }
      }
      into 'src/main/assets/com/gindin/zmanim/android'
    }
  }

  buildTypes {
    release {

      minifyEnabled true

      /*
       * Library-specific proguard files.
       * See https://github.com/krschultz/android-proguard-snippets.
       */
      proguardFile 'proguard-flurry.pro'
      proguardFile 'proguard-google-play-services.pro'
      proguardFile 'proguard-support-design.pro'
      proguardFile 'proguard-support-v7-appcompat.pro'
      proguardFile "proguard-project.pro"

      /* Reminder: Use the default proguard from the SDK, and then add in our custom proguard rules. */
      proguardFiles getDefaultProguardFile( 'proguard-android.txt' ), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }

    debug {
    }
  }

  productFlavors {
  }
}

dependencies {

  compile 'com.android.support:design:23.4.0'
  compile 'com.android.support:appcompat-v7:23.4.0'
  compile 'com.android.support:preference-v7:23.4.0'

  //  see https://github.com/jgindin/MaterialSeekBarPreference
  //compile 'com.gindin:material-seekbar-preference:0.13'

  // https://github.com/Gericop/Android-Support-Preference-V7-Fix
  //compile 'com.takisoft.fix:preference-v7:24.1.1.1'


  testCompile 'junit:junit:4.12'
}



Properties flurry = new Properties()
flurry.load( new FileInputStream( project.projectDir.getPath() + "/../common/flurry.properties" ) )
String flurryKey = flurry[ 'flurry.key' ]

task replaceFlurryKeyPlaceholders << {
  ant.replace( file: "src/main/java/com/gindin/util/LogUtils.java", token: "FLURRY_KEY_GOES_HERE", value: flurryKey )
}

task resetFlurryKeyPlaceholders << {
  ant.replace( file: "src/main/java/com/gindin/util/LogUtils.java", token: flurryKey, value: "FLURRY_KEY_GOES_HERE" )
}


Properties mapQuest = new Properties()
mapQuest.load( new FileInputStream( project.projectDir.getPath() + "/../common/MapQuest.properties" ) )
String mapQuestKey = mapQuest[ 'mapquest.key' ]

task replaceMapQuestPlaceholders << {
  ant.replace( file: "src/main/java/com/gindin/zmanim/android/location/resolvers/MapQuestResolver.java", token: "MAP_QUEST_KEY_GOES_HERE", value: mapQuestKey )
}

task resetMapQuestPlaceholders << {
  ant.replace( file: "src/main/java/com/gindin/zmanim/android/location/resolvers/MapQuestResolver.java", token: mapQuestKey, value: "MAP_QUEST_KEY_GOES_HERE" )
}


/* See http://stackoverflow.com/questions/16853130/run-task-before-compilation-using-android-gradle-plugin */
gradle.projectsEvaluated {

  compileDebugSources.dependsOn( "replaceMapQuestPlaceholders" )
  compileReleaseSources.dependsOn( "replaceMapQuestPlaceholders" )
  compileReleaseSources.dependsOn( "replaceFlurryKeyPlaceholders" )

  assembleDebug.dependsOn( "resetMapQuestPlaceholders" )
  assembleRelease.dependsOn( "resetMapQuestPlaceholders" )
  assembleRelease.dependsOn( "resetFlurryKeyPlaceholders" )
}
